name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
  # The tests above use a stand-in for LeRobot. This job installs the real one, at the version the
  # real-arm code is written against, and runs the checks that need it. No arm is involved.
  lerobot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One step, so torch and torchvision are picked together and match. Installing torch alone first
      # let LeRobot's torchvision come from another build, and torchvision then failed to load.
      - run: pip install -e ".[so101]" pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import lerobot"    # the tests below are skipped without it, so fail here first
      - run: python -m pytest -q tests/test_lerobot_api.py
